services:
  db:
    image: postgres:14
    container_name: ollama-chat-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER} -d ${DB_NAME}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile

    image: local-ollama-chat:1.0
    container_name: local-ollama-chat
    restart: unless-stopped

    network_mode: host

    env_file:
      - .env

    environment:
      DB_HOST: 127.0.0.1
      DB_PORT: "5433"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-false}"
      SESSION_TTL_SECONDS: "${SESSION_TTL_SECONDS:-86400}"

    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
