<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in · Local Ollama Chat</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 24px; background: #f5f5f5; color: #222; font-family: Arial, sans-serif; }
        main { max-width: 400px; margin: 8vh auto; padding: 28px; background: white; border-radius: 8px; }
        h1 { font-size: 24px; }
        label { display: block; margin-top: 18px; }
        input, button { width: 100%; padding: 12px; margin-top: 8px; border: 1px solid #999; border-radius: 5px; }
        button { margin-top: 24px; background: #202123; color: white; cursor: pointer; }
        button:disabled { opacity: 0.6; }
        #error { color: #a61c1c; }
    </style>
</head>
<body>
<main>
    <h1>Log in</h1>
    <p>Local Ollama Chat</p>
    <form id="auth-form" method="post" action="/login">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required maxlength="254">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required  maxlength="1024">
        
        <button id="submit" type="submit">Log in</button>
        <p id="error" role="alert" aria-live="polite"></p>
    </form>
    <p>New here? <a href="/register">Create an account</a>.</p>
    <noscript>JavaScript is required to submit this form.</noscript>
</main>
<script>
const form = document.getElementById("auth-form");
form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const button = document.getElementById("submit");
    const error = document.getElementById("error");
    error.textContent = "";
    button.disabled = true;
    try {
        const response = await fetch("/login", {
            method: "POST",
            credentials: "same-origin",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(Object.fromEntries(new FormData(form)))
        });
        const data = await response.json();
        if (!response.ok) {
            error.textContent = typeof data.detail === "string" ? data.detail : "Please check the form fields.";
            return;
        }
        form.reset();
        window.location.replace("/");
    } catch {
        error.textContent = "Could not reach the server. Please try again.";
    } finally {
        button.disabled = false;
    }
});
</script>
</body>
</html>
