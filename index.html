<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Local Ollama LLM Chat</title>


    <!-- Markdown renderer -->
    <script
        src="https://cdn.jsdelivr.net/npm/marked/marked.min.js">
    </script>


    <!-- HTML sanitizer -->
    <script
        src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js">
    </script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;

            font-family:
                Arial,
                sans-serif;

            background: #f5f5f5;

            color: #222;
        }


        #app {
            display: flex;

            height: 100vh;
        }


        /* -----------------------------------------
           Sidebar
        ----------------------------------------- */

        #sidebar {
            width: 280px;

            background: #202123;

            color: white;

            display: flex;

            flex-direction: column;

            border-right: 1px solid #333;
        }


        #sidebar-header {
            padding: 18px;

            border-bottom: 1px solid #3a3a3a;
        }


        #sidebar-title {
            margin-bottom: 12px;

            font-size: 18px;

            font-weight: bold;
        }


        #new-chat-button {
            width: 100%;

            padding: 11px;

            border: 1px solid #666;

            border-radius: 6px;

            background: transparent;

            color: white;

            cursor: pointer;
        }


        #new-chat-button:hover {
            background: #343541;
        }


        #conversation-list {
            flex: 1;

            min-height: 0;

            overflow-y: auto;

            padding: 8px;
        }


        #sidebar-account {
            flex-shrink: 0;
            margin-top: auto;
            padding: 16px;
            border-top: 1px solid #3a3a3a;
        }

        #account-identity {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        #account-avatar {
            display: grid;
            place-items: center;
            flex: 0 0 32px;
            height: 32px;
            border-radius: 50%;
            background: #565869;
            font-size: 13px;
            font-weight: bold;
        }

        #account-email {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 13px;
        }

        #logout-button {
            margin-top: 10px;
            padding: 6px 0;
            border: none;
            background: transparent;
            color: #ccc;
            font: inherit;
            font-size: 13px;
            cursor: pointer;
        }

        #logout-button:hover,
        #logout-button:focus-visible {
            color: white;
            text-decoration: underline;
        }

        #auth-status {
            margin: 8px 0 0;
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        #auth-status:empty {
            display: none;
        }


        .conversation-item {
            display: flex;

            align-items: center;

            gap: 5px;

            margin-bottom: 5px;

            border-radius: 6px;
        }


        .conversation-item.active {
            background: #343541;
        }


        .conversation-open {
            flex: 1;

            min-width: 0;

            padding: 11px;

            border: none;

            background: transparent;

            color: white;

            text-align: left;

            cursor: pointer;
        }


        .conversation-title {
            overflow: hidden;

            white-space: nowrap;

            text-overflow: ellipsis;
        }


        .delete-conversation {
            border: none;

            background: transparent;

            color: #aaa;

            padding: 8px;

            cursor: pointer;

            font-size: 16px;
        }


        .delete-conversation:hover {
            color: white;
        }


        /* -----------------------------------------
           Main application
        ----------------------------------------- */

        #main {
            flex: 1;

            min-width: 0;

            display: flex;

            flex-direction: column;

            background: white;
        }


        #main-header {
            padding: 18px 24px;

            border-bottom: 1px solid #ddd;
        }


        #main-header h1 {
            margin: 0;

            font-size: 22px;
        }


        #current-conversation-title {
            margin-top: 5px;

            color: #777;

            font-size: 14px;
        }


        #chat {
            flex: 1;

            overflow-y: auto;

            padding: 30px;

            max-width: 1000px;

            width: 100%;

            margin: 0 auto;
        }


        #empty-state {
            color: #888;

            text-align: center;

            margin-top: 100px;
        }


        .message {
            margin-bottom: 24px;

            line-height: 1.5;
        }


        .message-label {
            font-weight: bold;

            margin-bottom: 7px;
        }


        .user .message-content {
            background: #f1f1f1;

            padding: 12px 15px;

            border-radius: 8px;
        }


        .assistant .message-content {
            padding: 4px 0;
        }


        .assistant p {
            margin: 8px 0;
        }


        .assistant pre {
            background: #f4f4f4;

            padding: 12px;

            overflow-x: auto;

            border-radius: 6px;
        }


        .assistant code {
            background: #f4f4f4;

            padding: 2px 4px;

            border-radius: 3px;
        }


        .system {
            color: #666;

            font-style: italic;
        }


        .loading {
            margin-bottom: 20px;

            color: #777;

            font-style: italic;
        }


        /* -----------------------------------------
           Input
        ----------------------------------------- */

        #input-container {
            border-top: 1px solid #ddd;

            padding: 18px 24px;

            background: white;
        }


        #model-area {
            display: flex;

            align-items: center;

            gap: 10px;

            max-width: 1000px;

            margin: 0 auto 10px auto;
        }


        #model-label {
            font-size: 14px;

            font-weight: bold;

            color: #444;
        }


        #model-select {
            min-width: 170px;

            padding: 9px 10px;

            border: 1px solid #bbb;

            border-radius: 7px;

            background: white;

            color: #222;

            outline: none;

            cursor: pointer;
        }


        #model-select:focus {
            border-color: #666;
        }


        #model-select:disabled {
            opacity: 0.6;

            cursor: not-allowed;
        }


        #model-status {
            color: #777;

            font-size: 13px;
        }


        #input-area {
            display: flex;

            gap: 8px;

            max-width: 1000px;

            margin: 0 auto;
        }


        #message {
            flex: 1;

            padding: 13px;

            font-size: 16px;

            border: 1px solid #bbb;

            border-radius: 7px;

            outline: none;
        }


        #message:focus {
            border-color: #666;
        }


        #send-button {
            padding: 12px 22px;

            border: none;

            border-radius: 7px;

            background: #202123;

            color: white;

            cursor: pointer;
        }


        #send-button:disabled {
            opacity: 0.5;

            cursor: not-allowed;
        }


        /* -----------------------------------------
           Mobile
        ----------------------------------------- */

        @media (max-width: 700px) {

            #sidebar {
                width: 210px;
            }


            #chat {
                padding: 20px;
            }


            #input-container {
                padding: 12px;
            }

        }

    </style>

</head>


<body>


<div id="app">


    <aside id="sidebar">

        <div id="sidebar-header">

            <div id="sidebar-title">
                Conversations
            </div>


            <button
                id="new-chat-button"
                onclick="startNewChat()"
            >
                + New Chat
            </button>

        </div>


        <div id="conversation-list">
        </div>

        <div id="sidebar-account" role="region" aria-label="Your account">
            <div id="account-identity">
                <span id="account-avatar" aria-hidden="true">?</span>
                <span id="account-email">Loading account…</span>
            </div>
            <button id="logout-button" type="button" onclick="logout()">Log out</button>
            <p id="auth-status" role="status" aria-live="polite"></p>
        </div>

    </aside>



    <main id="main">


        <div id="main-header">

            <h1>
                Local Ollama LLM Chat
            </h1>


            <div id="current-conversation-title">
                New Chat
            </div>

        </div>



        <div id="chat">

            <div id="empty-state">
                Start a new conversation with the local LLM.
            </div>

        </div>



        <div id="input-container">

            <div id="model-area">

                <label
                    id="model-label"
                    for="model-select"
                >
                    Model:
                </label>

                <select
                    id="model-select"
                    disabled
                >
                    <option>
                        Loading models...
                    </option>
                </select>

                <span id="model-status">
                </span>

            </div>

            <div id="input-area">

                <input
                    id="message"
                    type="text"
                    placeholder="Ask the local LLM something..."
                    autocomplete="off"
                >

                <button
                    id="send-button"
                    onclick="sendMessage()"
                >
                    Send
                </button>

            </div>

        </div>


    </main>


</div>



<script>
// Authentication failures must never be treated as streamed chat or model fallback.
let leavingSession = false;
const sessionRequests = new AbortController();

function leaveSession() {
    leavingSession = true;
    sessionRequests.abort();
    messages = [];
    conversations = [];
    currentConversationId = null;
    document.getElementById("chat").replaceChildren();
    document.getElementById("conversation-list").replaceChildren();
    window.location.replace("/login");
}

async function apiFetch(url, options = {}) {
    const response = await fetch(url, {
        ...options, credentials: "same-origin", signal: sessionRequests.signal
    });
    if (response.status === 401) {
        leaveSession();
        const error = new Error("Session expired.");
        error.authHandled = true;
        throw error;
    }
    if (response.status === 503) {
        const data = await response.clone().json().catch(() => ({}));
        document.getElementById("auth-status").textContent = data.detail || "Service unavailable.";
        const error = new Error("Service unavailable.");
        error.authHandled = true;
        throw error;
    }
    return response;
}

async function checkSession() {
    if (leavingSession) return;
    try {
        const response = await apiFetch("/auth/session");
        if (!response.ok) return;
        const data = await response.json();
        const email = data.user.email;
        const emailLabel = document.getElementById("account-email");
        emailLabel.textContent = email;
        emailLabel.title = email;
        document.getElementById("account-avatar").textContent =
            Array.from(email.split("@")[0]).slice(0, 2).join("").toUpperCase();
    } catch {
        // apiFetch handles expiry; transient network failures do not log users out.
    }
}

async function logout() {
    try {
        const response = await apiFetch("/logout", {method: "POST"});
        if (!response.ok) throw new Error("Logout failed.");
        leaveSession();
    } catch {
        if (!leavingSession) {
            document.getElementById("auth-status").textContent = "Could not log out. Please try again.";
        }
    }
}

window.addEventListener("focus", checkSession);
window.addEventListener("pageshow", checkSession);
setInterval(checkSession, 60000);



/*
    The currently selected PostgreSQL conversation.
*/
let currentConversationId = null;


/*
    Local copy used only for displaying the UI.

    PostgreSQL is now the persistent source of truth.
*/
let messages = [];


/*
    Prevent changing conversations while a response
    is currently streaming.
*/
let isSending = false;


/*
    Cached conversation list.
*/
let conversations = [];


/*
    Models returned by FastAPI /models.

    FastAPI remains the source of truth for which
    Ollama models this browser is allowed to use.
*/
let availableModels = [];


/*
    Load selectable Ollama models from FastAPI.
*/
async function loadModels() {

    const select =
        document.getElementById(
            "model-select"
        );


    const status =
        document.getElementById(
            "model-status"
        );


    try {

        const response =
            await apiFetch(
                "/models"
            );


        if (!response.ok) {

            throw new Error(
                "Could not load models."
            );

        }


        const data =
            await response.json();


        availableModels =
            Array.isArray(data.models)
                ? data.models
                : [];


        select.innerHTML =
            "";


        for (const model of availableModels) {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                model;


            option.textContent =
                model;


            select.appendChild(
                option
            );

        }


        if (
            data.default_model &&
            availableModels.includes(
                data.default_model
            )
        ) {

            select.value =
                data.default_model;

        }


        if (
            availableModels.length === 0
        ) {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                "";


            option.textContent =
                "No models available";


            select.appendChild(
                option
            );


            select.disabled =
                true;


            status.textContent =
                "No selectable models returned by FastAPI.";


            return;

        }


        select.disabled =
            false;


        status.textContent =
            "Selected model will be used for the next message.";

    }

    catch (error) {
        if (leavingSession || error.authHandled) return;

        console.error(
            error
        );


        select.innerHTML =
            "";


        const option =
            document.createElement(
                "option"
            );


        option.value =
            "qwen3:8b";


        option.textContent =
            "qwen3:8b";


        select.appendChild(
            option
        );


        select.value =
            "qwen3:8b";


        select.disabled =
            false;


        status.textContent =
            "Could not load /models; using qwen3:8b fallback.";

    }

}



function scrollToBottom() {

    const chat =
        document.getElementById("chat");


    chat.scrollTop =
        chat.scrollHeight;
}



function clearChat() {

    const chat =
        document.getElementById("chat");


    chat.innerHTML = "";
}



function showEmptyState() {

    clearChat();


    const empty =
        document.createElement("div");


    empty.id =
        "empty-state";


    empty.textContent =
        "Start a new conversation with the local LLM.";


    document
        .getElementById("chat")
        .appendChild(empty);
}



/*
    User message.
*/
function addUserMessage(message) {

    const chat =
        document.getElementById("chat");


    const wrapper =
        document.createElement("div");


    wrapper.className =
        "message user";


    const label =
        document.createElement("div");


    label.className =
        "message-label";


    label.textContent =
        "You";


    const content =
        document.createElement("div");


    content.className =
        "message-content";


    content.textContent =
        message;


    wrapper.appendChild(label);

    wrapper.appendChild(content);

    chat.appendChild(wrapper);


    scrollToBottom();
}



/*
    Assistant message container.
*/
function createAssistantMessage(model = null) {

    const chat =
        document.getElementById("chat");


    const wrapper =
        document.createElement("div");


    wrapper.className =
        "message assistant";


    const label =
        document.createElement("div");


    label.className =
        "message-label";


    label.textContent =
        model
            ? "Assistant · " + model
            : "Assistant";


    const content =
        document.createElement("div");


    content.className =
        "message-content";


    wrapper.appendChild(label);

    wrapper.appendChild(content);

    chat.appendChild(wrapper);


    scrollToBottom();


    return content;
}



/*
    System message.
*/
function addSystemMessage(message) {

    const chat =
        document.getElementById("chat");


    const div =
        document.createElement("div");


    div.className =
        "message system";


    div.textContent =
        "System: " + message;


    chat.appendChild(div);


    scrollToBottom();
}



/*
    Markdown rendering for assistant responses.
*/
function renderAssistantMarkdown(
    element,
    message
) {

    const cleanedMessage =
        message.replace(
            /&(?:amp;)*#(?:x0*20|0*32);/gi,
            " "
        ).replace(
            /&(?:amp;)*#(?:x0*2(?:0)?|0*3(?:2)?)?$/i,
            ""
        );


    const markdownHtml =
        marked.parse(
            cleanedMessage
        );


    const safeHtml =
        DOMPurify.sanitize(
            markdownHtml
        );


    element.innerHTML =
        safeHtml;


    scrollToBottom();
}



/*
    Loading indicator.
*/
function addLoadingMessage() {

    const chat =
        document.getElementById("chat");


    const div =
        document.createElement("div");


    div.className =
        "loading";


    div.textContent =
        "Assistant is thinking...";


    chat.appendChild(div);


    scrollToBottom();


    return div;
}



/*
    Render all messages loaded from PostgreSQL.
*/
function renderMessages() {

    clearChat();


    if (messages.length === 0) {

        showEmptyState();

        return;
    }


    for (const message of messages) {


        if (message.role === "user") {

            addUserMessage(
                message.content
            );

        }


        else if (
            message.role === "assistant"
        ) {

            const assistantDiv =
                createAssistantMessage(
                    message.model
                );


            renderAssistantMarkdown(
                assistantDiv,
                message.content
            );

        }


        else if (
            message.role === "system"
        ) {

            addSystemMessage(
                message.content
            );

        }

    }


    scrollToBottom();
}



/*
    Render the sidebar.
*/
function renderConversationList() {

    const list =
        document.getElementById(
            "conversation-list"
        );


    list.innerHTML = "";


    for (
        const conversation
        of conversations
    ) {

        const row =
            document.createElement("div");


        row.className =
            "conversation-item";


        if (
            conversation.id ===
            currentConversationId
        ) {

            row.classList.add(
                "active"
            );

        }


        const openButton =
            document.createElement("button");


        openButton.className =
            "conversation-open";


        const title =
            document.createElement("div");


        title.className =
            "conversation-title";


        title.textContent =
            conversation.title;


        openButton.appendChild(
            title
        );


        openButton.onclick =
            function() {

                loadConversation(
                    conversation.id
                );

            };


        const deleteButton =
            document.createElement("button");


        deleteButton.className =
            "delete-conversation";


        deleteButton.textContent =
            "×";


        deleteButton.title =
            "Delete conversation";


        deleteButton.onclick =
            function(event) {

                event.stopPropagation();


                deleteConversation(
                    conversation.id
                );

            };


        row.appendChild(
            openButton
        );


        row.appendChild(
            deleteButton
        );


        list.appendChild(
            row
        );

    }

}



/*
    Ask FastAPI for the conversation list.
*/
async function refreshConversations(
    autoOpenLatest = false
) {

    try {

        const response =
            await apiFetch(
                "/conversations"
            );


        if (!response.ok) {

            throw new Error(
                "Could not load conversations."
            );

        }


        const data =
            await response.json();


        conversations =
            data.conversations;


        renderConversationList();


        /*
            On the first page load, automatically
            reopen the most recently updated chat.

            This is what makes browser refresh
            restore the conversation.
        */
        if (
            autoOpenLatest &&
            currentConversationId === null &&
            conversations.length > 0
        ) {

            await loadConversation(
                conversations[0].id
            );

        }

    }

    catch (error) {
        if (leavingSession || error.authHandled) return;

        console.error(
            error
        );

    }

}



/*
    Load one conversation from PostgreSQL.
*/
async function loadConversation(
    conversationId
) {

    if (isSending) {
        return;
    }


    try {

        const response =
            await apiFetch(
                "/conversations/"
                + conversationId
            );


        if (!response.ok) {

            throw new Error(
                "Could not load conversation."
            );

        }


        const data =
            await response.json();


        currentConversationId =
            data.conversation.id;


        messages =
            data.messages;


        document
            .getElementById(
                "current-conversation-title"
            )
            .textContent =
                data.conversation.title;


        renderMessages();

        renderConversationList();

    }

    catch (error) {
        if (leavingSession || error.authHandled) return;

        console.error(
            error
        );

    }

}



/*
    Start a new conversation.

    No PostgreSQL row is created yet.

    The row is created only when the first message
    is actually sent.
*/
function startNewChat() {

    if (isSending) {
        return;
    }


    currentConversationId =
        null;


    messages = [];


    document
        .getElementById(
            "current-conversation-title"
        )
        .textContent =
            "New Chat";


    showEmptyState();

    renderConversationList();


    document
        .getElementById("message")
        .focus();
}



/*
    Delete conversation.

    The messages are automatically removed by
    PostgreSQL ON DELETE CASCADE.
*/
async function deleteConversation(
    conversationId
) {

    if (isSending) {
        return;
    }


    const confirmed =
        window.confirm(
            "Delete this conversation?"
        );


    if (!confirmed) {
        return;
    }


    try {

        const response =
            await apiFetch(
                "/conversations/"
                + conversationId,
                {
                    method: "DELETE"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Could not delete conversation."
            );

        }


        if (
            currentConversationId ===
            conversationId
        ) {

            currentConversationId =
                null;


            messages = [];


            document
                .getElementById(
                    "current-conversation-title"
                )
                .textContent =
                    "New Chat";


            showEmptyState();

        }


        await refreshConversations(
            false
        );

    }

    catch (error) {
        if (leavingSession || error.authHandled) return;

        console.error(
            error
        );

    }

}



/*
    Send one new message.

    We no longer send the entire browser history.

    FastAPI loads the real history from PostgreSQL.
*/
async function sendMessage() {

    if (isSending) {
        return;
    }


    const input =
        document.getElementById(
            "message"
        );


    const sendButton =
        document.getElementById(
            "send-button"
        );


    const modelSelect =
        document.getElementById(
            "model-select"
        );


    const message =
        input.value.trim();


    const selectedModel =
        modelSelect.value;


    if (!message) {
        return;
    }


    if (!selectedModel) {

        addSystemMessage(
            "Please select a model before sending a message."
        );

        return;
    }


    isSending = true;


    /*
        Display the user's message immediately.
    */
    messages.push({

        role: "user",

        content: message

    });


    /*
        Remove empty state if this is a new chat.
    */
    const emptyState =
        document.getElementById(
            "empty-state"
        );


    if (emptyState) {

        emptyState.remove();

    }


    addUserMessage(
        message
    );


    input.value = "";

    input.disabled = true;

    sendButton.disabled = true;

    modelSelect.disabled = true;


    const loadingDiv =
        addLoadingMessage();


    let assistantDiv =
        null;


    let assistantText =
        "";


    let responseModel =
        selectedModel;


    try {

        const response =
            await apiFetch(
                "/chat",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify({

                        conversation_id:
                            currentConversationId,

                        message:
                            message,

                        model:
                            selectedModel

                    })

                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP error: "
                + response.status
            );

        }


        /*
            If this was the first message in a new
            conversation, FastAPI created a PostgreSQL
            conversation and returns its ID here.
        */
        const returnedConversationId =
            response.headers.get(
                "X-Conversation-ID"
            );


        if (
            returnedConversationId
        ) {

            currentConversationId =
                Number(
                    returnedConversationId
                );

        }


        const returnedModel =
            response.headers.get(
                "X-Ollama-Model"
            );


        if (returnedModel) {

            responseModel =
                returnedModel;


            document
                .getElementById(
                    "model-status"
                )
                .textContent =
                "Last response: "
                + returnedModel;

        }


        if (!response.body) {

            throw new Error(
                "Streaming response body is unavailable."
            );

        }


        const reader =
            response.body.getReader();


        const decoder =
            new TextDecoder();


        while (true) {


            const {
                value,
                done
            } =
                await reader.read();


            if (done) {
                break;
            }


            const chunk =
                decoder.decode(
                    value,
                    {
                        stream: true
                    }
                );


            if (!assistantDiv) {

                if (
                    loadingDiv.isConnected
                ) {

                    loadingDiv.remove();

                }


                assistantDiv =
                    createAssistantMessage(
                        responseModel
                    );

            }


            assistantText +=
                chunk;


            renderAssistantMarkdown(
                assistantDiv,
                assistantText
            );

        }


        assistantText +=
            decoder.decode();


        if (
            assistantDiv &&
            assistantText
        ) {

            renderAssistantMarkdown(
                assistantDiv,
                assistantText
            );

        }


        if (
            assistantText
        ) {

            messages.push({

                role: "assistant",

                content: assistantText,

                model: responseModel

            });

        }


        /*
            Refresh sidebar after PostgreSQL has been
            updated.
        */
        await refreshConversations(
            false
        );


        /*
            Update the title shown above the chat.
        */
        const currentConversation =
            conversations.find(
                conversation =>
                    conversation.id ===
                    currentConversationId
            );


        if (
            currentConversation
        ) {

            document
                .getElementById(
                    "current-conversation-title"
                )
                .textContent =
                    currentConversation.title;

        }

    }

    catch (error) {
        if (leavingSession || error.authHandled) return;

        console.error(
            error
        );


        if (
            loadingDiv.isConnected
        ) {

            loadingDiv.remove();

        }


        if (
            assistantDiv &&
            assistantText
        ) {

            assistantText +=
                "\n\n**Streaming interrupted.**";


            renderAssistantMarkdown(
                assistantDiv,
                assistantText
            );

        }

        else {

            const errorDiv =
                createAssistantMessage();


            renderAssistantMarkdown(
                errorDiv,
                "**Error:** Could not get a response from the server."
            );

        }

    }

    finally {

        if (
            loadingDiv.isConnected
        ) {

            loadingDiv.remove();

        }


        isSending = false;


        input.disabled =
            false;


        sendButton.disabled =
            false;


        modelSelect.disabled =
            availableModels.length === 0;


        input.focus();

    }

}



/*
    Press Enter to send.
*/
document
    .getElementById("message")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );



/*
    Page startup.

    Load PostgreSQL conversations and automatically
    reopen the most recently updated conversation.
*/
window.addEventListener(
    "DOMContentLoaded",
    async function() {

        await loadModels();


        await refreshConversations(
            true
        );


        document
            .getElementById(
                "message"
            )
            .focus();

    }
);


</script>
