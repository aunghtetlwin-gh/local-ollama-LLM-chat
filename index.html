<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <title>Local Qwen Chat</title>

    <!-- Markdown -> HTML -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Sanitize generated HTML -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
        }

        #chat {
            border: 1px solid #ccc;
            padding: 20px;
            min-height: 300px;
            margin-bottom: 20px;
        }

        .user {
            margin: 10px 0;
            font-weight: bold;
        }

        .assistant {
            margin: 10px 0 20px 0;
        }

        .assistant p {
            margin: 6px 0;
        }

        .assistant pre {
            background: #f4f4f4;
            padding: 10px;
            overflow-x: auto;
        }

        .assistant code {
            background: #f4f4f4;
            padding: 2px 4px;
        }

        #input-area {
            display: flex;
            gap: 8px;
        }

        input {
            flex: 1;
            padding: 10px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<h1>Local Qwen Chat</h1>

<div id="chat"></div>

<div id="input-area">

    <input
        id="message"
        type="text"
        placeholder="Ask Qwen something..."
    >

    <button onclick="sendMessage()">
        Send
    </button>

</div>


<script>

const messages = [];


/*
    Display user's message.

    We use textContent instead of innerHTML
    because user input should be treated as plain text.
*/
function addUserMessage(message) {

    const chat = document.getElementById("chat");

    const div = document.createElement("div");

    div.className = "user";

    div.textContent = "You: " + message;

    chat.appendChild(div);
}


/*
    Display Qwen's answer.

    Qwen often returns Markdown such as:

    ## Kubernetes
    **Pods**
    - item 1
    - item 2

    marked.parse()
        Markdown -> HTML

    DOMPurify.sanitize()
        clean the HTML before displaying it
*/
function addAssistantMessage(message) {

    const chat = document.getElementById("chat");

    const div = document.createElement("div");

    div.className = "assistant";


    const markdownHtml = marked.parse(message);

    const safeHtml = DOMPurify.sanitize(markdownHtml);


    div.innerHTML = safeHtml;

    chat.appendChild(div);
}


/*
    Send conversation to FastAPI.
*/
async function sendMessage() {

    const input = document.getElementById("message");

    const message = input.value.trim();


    if (!message) {
        return;
    }


    /*
        Save user message into conversation history.
    */
    messages.push({
        role: "user",
        content: message
    });


    addUserMessage(message);


    input.value = "";


    try {

        /*
            Browser
              ↓
            POST /chat
              ↓
            FastAPI
        */
        const response = await fetch("/chat", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                messages: messages
            })
        });


        if (!response.ok) {
            throw new Error(
                "HTTP error: " + response.status
            );
        }


        /*
            FastAPI JSON
                ↓
            JavaScript object
        */
        const data = await response.json();


        /*
            Save Qwen answer into conversation history.
        */
        messages.push({
            role: "assistant",
            content: data.answer
        });


        addAssistantMessage(data.answer);

    }

    catch (error) {

        console.error(error);

        addAssistantMessage(
            "**Error:** Could not get a response from the server."
        );
    }
}


/*
    Press Enter to send message.
*/
document
    .getElementById("message")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {

            event.preventDefault();

            sendMessage();
        }
    });

</script>

</body>
</html>
